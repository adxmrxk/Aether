global:
  scrape_interval: 15s
  evaluation_interval: 15s

scrape_configs:
  - job_name: 'aether-api'
    static_configs:
      - targets: ['api:8080']
    metrics_path: /metrics

  - job_name: 'prometheus'
    static_configs:
      - targets: ['localhost:9090']

  # Redis exposes no Prometheus endpoint; scraping :6379 only creates a
  # permanently down target. Add oliver006/redis_exporter to collect these.
